[alembic]
# Ubicación de las migraciones.
script_location = alembic

# La URL de conexión NO se define aquí a propósito: se resuelve en
# alembic/env.py a partir de app.core.config.get_settings() (que a su vez
# lee DATABASE_URL del entorno / archivo .env). Así el mismo alembic.ini
# versionado en git sirve para desarrollo, staging y producción sin exponer
# ninguna credencial en el repositorio.
sqlalchemy.url =

# Plantilla de nombre de archivo de migración: fecha + slug legible, para
# poder ordenar y encontrar migraciones a simple vista en el historial git.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Zona horaria de los timestamps embebidos en cada archivo de migración.
timezone = UTC

# Ancho máximo de línea al autogenerar (estilo de código).
truncate_slug_length = 40

[post_write_hooks]
# Sin hooks de formateo automático (black/ruff) en este MVP para mantener
# el setup simple; se puede agregar más adelante si el equipo lo prefiere.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
